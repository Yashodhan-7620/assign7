name: ML CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache scikit-learn dataset
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: sklearn-california-housing-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src tests --max-line-length=100 --ignore=E203,W503 --exclude=__pycache__

      - name: Run pytest with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  train-and-package:
    name: Train & Package Model
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache scikit-learn dataset
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: sklearn-california-housing-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python -m src.train

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/regression.pkl
            models/scaler.pkl
          retention-days: 30

      # Optional CD step: push the trained model to a release, a model
      # registry, or a deployment target. Left commented since it depends
      # on where you actually want to deploy to.
      #
      # - name: Deploy model
      #   run: |
      #     echo "Add your deployment step here (e.g. upload to S3,
      #     push to Hugging Face Hub, hit a deploy webhook, etc.)"
